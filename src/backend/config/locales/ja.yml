# 表示言語は日本語のみとし、多言語対応は行わない（CLAUDE.md の方針）。
# このファイルは翻訳のためではなく、日本語の文言をコードから分離して置くカタログとして使う。
#
# Rails 本体が出すメッセージ（バリデーション文言・RecordInvalid の例外文・to_sentence の
# 連結詞・日付書式）は rails-i18n gem が供給する。ここに書き写すと二重管理になり、
# gem 側が直っても古い文言が残るため、ここにはアプリ固有の項目名と文言だけを置く。
#
# ja に無いキーは英語に落ちず "Translation missing: ja.…" という文字列になって
# 利用者とログに出る（production の config.i18n.fallbacks は default_locale = :ja へ
# 落とす設定のため、フォールバック先が :ja 自身になる）。
# 網羅性は spec/lib/locale_catalog_spec.rb が検査している。
ja:
  # コントローラが返すユーザー向け文言。モデルのバリデーション由来ではないものはここに置く。
  # コントローラ側への直書きは spec/lib/controller_message_literals_spec.rb で検査している。
  api:
    errors:
      invalid_board_title: "タイトルの形式が正しくありません"
      parameter_missing: "必要な項目が指定されていません"
      invalid_comment_body: "コメントの形式が正しくありません"
      board_not_found: "ボードが見つかりません"
      board_or_object_not_found: "ボードまたはオブジェクトが見つかりません"
      board_or_object_type_not_found: "ボードまたはオブジェクト種別が見つかりません"
      object_was_locked_by_another_user: "オブジェクトは別のユーザーにロックされています"
      lamport_ts_must_be_an_integer: "Lamport時刻は整数で入力してください"
      unsupported_invite_role: "招待された権限に対応していません"
      cannot_remove_the_last_owner: "最後のオーナーは削除できません"
      comment_could_not_be_recorded: "コメントを記録できませんでした"
      cannot_skip_quest: "クエストをスキップできません"
      cannot_reopen_quest: "クエストを再開できません"
      cannot_claim_reward: "報酬を受け取れません"
      forbidden_origin: "許可されていないオリジンです"
      content_type_must_be_json: "Content-Type は application/json である必要があります"
      invalid_intensity: "表示強度が正しくありません"
      recaptcha_verification_failed: "reCAPTCHA の検証に失敗しました"
      x_oauth_failed: "Xログインに失敗しました"
      manual_recheck_cooldown_active: "手動再判定はあと%{remainingMinutes}分%{remainingSeconds}秒後にできます"
      # I18n::MissingTranslationData を ApplicationController#render_missing_translation
      # が受けたときの応答文言。undefined なキー自体の説明を利用者に見せるわけにはいかない
      # （内部のキー名が漏れる）ため、汎用の500文言にする。原因はログ（error.message）に残す。
      internal_server_error: "サーバーエラーが発生しました"

  # モデルをまたいで同じ意味で使う項目名。activerecord.attributes に無いときの既定として
  # 参照されるため、モデルごとに同じ和名を書き写さずに済む。
  attributes:
    board: "ボード"
    board_object: "オブジェクト"
    user: "ユーザー"

  activerecord:
    # モデル名。restrict_dependent_destroy のように %{record} / %{model} を補間する
    # メッセージで使われる。未定義だと「User settingsが存在しているので削除できません」の
    # ように英語のモデル名が混ざる。
    models:
      board: "ボード"
      board_member: "ボードメンバー"
      board_object: "オブジェクト"
      color_palette: "カラーパレット"
      comment: "コメント"
      effect_master: "エフェクト"
      follower_cache: "フォロワーキャッシュ"
      event_def: "イベント定義"
      frame_lock: "フレームロック"
      intensity_master: "表示強度"
      kpi_event: "KPIイベント"
      plan: "プラン"
      object_op: "オブジェクト操作"
      object_type: "オブジェクト種別"
      quest: "クエスト"
      radial_menu_item: "ラジアルメニュー項目"
      role: "権限"
      user: "ユーザー"
      user_quest: "ユーザークエスト"
      user_setting: "ユーザー設定"

    attributes:
      board:
        title: "タイトル"
      board_member:
        role: "権限"
      board_object:
        color_palette: "カラーパレット"
        object_type: "オブジェクト種別"
        parent_frame_id: "親フレーム"
      comment:
        body: "コメント"
      event_def:
        effect_master: "エフェクト"
      frame_lock:
        locked_by_user: "ロックしたユーザー"
      follower_cache:
        fetched_at: "取得時刻"
      kpi_event:
        event_def: "イベント定義"
      object_op:
        property: "プロパティ"
        client_id: "クライアントID"
        lamport_ts: "Lamport時刻"
      plan:
        code: "プランコード"
      quest:
        title: "クエスト名"
        condition_event: "条件イベント"
        condition_count: "条件回数"
      role:
        code: "権限コード"
      user:
        x_user_id: "XユーザーID"
        display_name: "X表示名"
        plan: "プラン"
      user_quest:
        quest: "クエスト"
        state: "状態"
        progress: "進捗"
        user_id: "ユーザー"
      user_setting:
        intensity_master: "表示強度"

    errors:
      models:
        board_object:
          attributes:
            parent_frame_id:
              # BoardObject#parent_frame_must_belong_to_same_board から参照する。
              invalid_parent_frame: "は同じボード上の有効なフレームを指定してください"

  admin:
    kpi_dashboard_report:
      intensity_labels:
        full: "フル"
        subtle: "控えめ"
        "off": "オフ"
    users:
      create:
        params_missing: "XユーザーIDと表示名は必須です。"
        success: "手動ログインを許可しました。"
        failure: "ユーザーの保存に失敗しました。"
      toggle_bypass:
        success: "手動ログイン許可状態を更新しました。"
        failure: "更新に失敗しました。"
        status_allow: "許可"
        status_disallow: "解除"
