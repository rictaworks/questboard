# 表示言語は日本語のみとし、多言語対応は行わない（CLAUDE.md の方針）。
# en.yml は Rails 本体や gem が :en を前提に参照する経路が残っているため置いたままにする。
# ロケール切替のための入口ではないので、URL やヘッダからロケールを解決する仕組みは足さない。
ja:
  # コントローラが返すユーザー向け文言。モデルのバリデーション由来ではないものはここに置く。
  # コントローラ側への直書きは spec/lib/controller_message_literals_spec.rb で検査している。
  api:
    errors:
      parameter_missing: "リクエストの内容が正しくありません"
  errors:
    format: "%{attribute}%{message}"
    messages:
      blank: "を入力してください"
      inclusion: "は一覧にありません"
      taken: "はすでに使用されています"
      greater_than: "は%{count}より大きい値にしてください"
      greater_than_or_equal_to: "は%{count}以上の値にしてください"
      not_a_number: "は数値で入力してください"
  activerecord:
    attributes:
      board:
        title: "タイトル"
      comment:
        body: "コメント"
      object_op:
        property: "プロパティ"
        client_id: "クライアントID"
        lamport_ts: "Lamport時刻"
      quest:
        title: "クエスト名"
        condition_event: "条件イベント"
        condition_count: "条件回数"
      role:
        code: "権限コード"
      user:
        google_sub: "Googleサブ"
        display_name: "表示名"
      user_quest:
        state: "状態"
        progress: "進捗"
        user_id: "ユーザー"
      user_setting:
        intensity_master: "表示強度"
