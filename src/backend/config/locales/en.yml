# このファイルに翻訳を書いても効かない。
#
# 表示言語は日本語のみとし、多言語対応は行わない方針（CLAUDE.md）のため、
# config/application.rb で available_locales を [ :ja ] に絞っている。:en は利用可能な
# ロケールに含まれず、ここに書いた内容は読み込みの過程で捨てられる。例外にも警告にも
# ならないため、書いた側は何の反応も得られないまま、その文言が出ないことにだけ気付く。
# 参照しようとすると（I18n.t("...", locale: :en)）I18n::InvalidLocale で失敗する。
#
# 文言は config/locales/ja.yml に置くこと。Rails 本体や gem が出す英語メッセージは
# このファイルではなく gem 側の locale が持っており、その日本語版は rails-i18n が供給している。
#
# 値の無いキーだけを残しているのは、中身の無い YAML を I18n が InvalidLocaleData として
# 拒むため。このファイル自体は無くても動作は変わらない。
# ja.yml 以外に翻訳キーが増えていないことは spec/lib/locale_catalog_spec.rb が検査する。
en:
