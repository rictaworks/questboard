version: 2

# osv-scanner（CI の Security / Dependency scan）が「検知」を担い、
# Dependabot が「更新 PR の作成」を担う。両輪で、脆弱性を溜めずに回す。
# セキュリティ更新の PR は open-pull-requests-limit に関係なく作成される。
#
# cooldown は公開直後の版を即座に取り込まないための待機期間（issue #242）。
# 公開直後の版には、取り込み後に問題が判明するもの（不安定な版、公開元の
# 乗っ取りによる悪意ある版）が混じりうる。
#
# **cooldown は通常の版更新にのみ効き、セキュリティ更新には適用されない。**
# 脆弱性の修正が待たされることはない（GitHub のドキュメントに明記されている）。
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # 個別 PR が乱立すると確認しきれないため、通常更新はまとめる。
      # セキュリティ更新は Dependabot が別途 PR を立てる。
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: bundler
    directory: /src/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      bundler-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /src/sync-server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # CI で使う action 自体も更新対象にする（サプライチェーンの一部であるため）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
