name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint:
    name: Frontend / ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint

  frontend-test:
    name: Frontend / build & test (node --test)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ENV: production
      NEXT_PUBLIC_ENABLE_LAYOUT_FIXTURE: "true"
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: test-site-key
      NEXT_PUBLIC_SYNC_SERVER_URL: ws://127.0.0.1:8080
      NEXT_PUBLIC_X_CLIENT_ID: test-client-id
      NEXT_PUBLIC_X_FOLLOW_TARGET_HANDLE: rictaworks
      NEXT_PUBLIC_X_REDIRECT_URI: http://127.0.0.1:3000/auth/x/callback
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: src/sync-server/go.sum
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start frontend and run Playwright layout tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm start -- -p 3000 > /tmp/questboard-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS "$PLAYWRIGHT_BASE_URL" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Next.js server failed to start"
              cat /tmp/questboard-next.log
              exit 1
            fi
            sleep 1
          done

          node --test test/*.test.mjs

  go-test:
    name: Go / go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: src/sync-server/go.sum
      - run: go test ./tools/... ./src/sync-server/...

  go-lint:
    name: Go / golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: src/sync-server/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3

  backend-rspec:
    name: Backend / RSpec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: questboard
          POSTGRES_PASSWORD: questboard
          POSTGRES_DB: questboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U questboard -d questboard_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: src/backend
      - name: Run RSpec
        env:
          RAILS_ENV: test
          POSTGRES_TEST_DB: questboard_test
          POSTGRES_USER: questboard
          POSTGRES_PASSWORD: questboard
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: bundle exec rspec

  backend-rubocop:
    name: Backend / RuboCop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: src/backend
      - run: bundle exec rubocop

  backend-brakeman:
    name: Backend / Brakeman (security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: src/backend
      - run: bundle exec brakeman --no-pager
