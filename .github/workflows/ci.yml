name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 依存脆弱性は「コードが変わらなくても」新規公表で増える。PR・push だけの実行では
  # 更新の無い期間に検知できないため、日次でも走らせる（v1.0.0 で20件を溜めた反省）。
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  workflow_dispatch:
    inputs:
      alert_drill:
        description: "通知経路の試験。閾値を超えていなくてもジョブを失敗させ、Slack 通知を発火させる"
        type: boolean
        default: false

jobs:
  frontend-lint:
    name: Frontend / ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint

  frontend-test:
    name: Frontend / build & test (node --test)
    runs-on: ubuntu-latest
    # 既定の6時間まで走らせない。Playwright のブラウザ導入が断続的にハングする事象が
    # 2026-08-19 に2回発生し（PR #201・#223）、いずれも手動キャンセルが必要だった。
    # 上限を切っておけば、ハングしても短時間で失敗として表面化する。
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ENV: production
      NEXT_PUBLIC_ENABLE_LAYOUT_FIXTURE: "true"
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: test-site-key
      NEXT_PUBLIC_SYNC_SERVER_URL: ws://127.0.0.1:8080
      NEXT_PUBLIC_X_CLIENT_ID: test-client-id
      NEXT_PUBLIC_X_FOLLOW_TARGET_HANDLE: rictaworks
      NEXT_PUBLIC_X_REDIRECT_URI: http://127.0.0.1:3000/auth/x/callback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache-dependency-path: src/sync-server/go.sum
      - run: npm install -g npm@11
      - run: npm ci
      # Playwright のブラウザ本体はキャッシュする。毎回ダウンロードするとハングの機会が
      # 増えるうえ、CI 時間も伸びるため（上記 timeout-minutes のコメント参照）。
      # キャッシュキーは実際に解決された playwright のバージョンに紐づける。
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      # --with-deps を付けない。ハングの原因は「ブラウザのダウンロード」ではなく
      # --with-deps が走らせる apt-get update で、archive.ubuntu.com への接続が
      # 詰まることだった（2026-08-19 に PR #201 / #223 / main CI の3回発生。
      # main CI のログでミラー応答の停止を確認）。
      # ubuntu-24.04 ランナーには Chromium の実行に必要な共有ライブラリが同梱されて
      # いるため apt は不要。仮に不足していればブラウザ起動時に明確なエラーで落ちるので、
      # 見逃しにはならない。キャッシュがあればこのステップはほぼ即時に終わる。
      - name: Install Playwright browser
        timeout-minutes: 10
        run: npx playwright install chromium
      - run: npm run build
      - name: Start frontend and run Playwright layout tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm start -- -p 3000 > /tmp/questboard-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS "$PLAYWRIGHT_BASE_URL" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Next.js server failed to start"
              cat /tmp/questboard-next.log
              exit 1
            fi
            sleep 1
          done

          node --test test/*.test.mjs

  go-test:
    name: Go / go test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache-dependency-path: src/sync-server/go.sum
      - run: go test ./tools/... ./src/sync-server/...

  go-lint:
    name: Go / golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache-dependency-path: src/sync-server/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3

  backend-rspec:
    name: Backend / RSpec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: questboard
          POSTGRES_PASSWORD: questboard
          POSTGRES_DB: questboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U questboard -d questboard_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: src/backend
      - name: Run RSpec
        env:
          RAILS_ENV: test
          POSTGRES_TEST_DB: questboard_test
          POSTGRES_USER: questboard
          POSTGRES_PASSWORD: questboard
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: bundle exec rspec

  backend-rubocop:
    name: Backend / RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: src/backend
      - run: bundle exec rubocop

  backend-brakeman:
    name: Backend / Brakeman (security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: src/backend
      - run: bundle exec brakeman --no-pager

  # 依存関係（npm / RubyGems / Go）の既知脆弱性を osv.dev と照合する。
  # PR・push に加えて日次でも走る（on.schedule 参照）。検出があればジョブを落とし、
  # 「修正版が公表済みの脆弱性を放置したままリリースする」状態を作らない。
  dependency-scan:
    name: Security / Dependency scan (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install osv-scanner
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.2.4/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      # 3エコシステム4ファイルを1回で走査する。--lockfile は「実際に解決される
      # 固定バージョン」を見るため、マニフェストのバージョン範囲指定より精度が高い。
      # Go は2モジュール構成（ルートの tools/ と src/sync-server）なので両方を指定する。
      # go.mod の go ディレクティブは stdlib の要求バージョンとして照合されるため、
      # 古い宣言のままだと修正済みの stdlib 脆弱性を抱えた状態として検出される。
      # （--recursive でのディレクトリ走査は node_modules まで舐めて遅いので使わない）
      - name: Scan dependencies (npm / RubyGems / Go)
        run: |
          osv-scanner scan \
            --lockfile package-lock.json \
            --lockfile src/backend/Gemfile.lock \
            --lockfile go.mod \
            --lockfile src/sync-server/go.mod

  metrics-threshold:
    name: Security / Sync metrics threshold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 本番の値を見るジョブなので PR・push では走らせない。日次 cron と手動実行のみ。
    # 外形監視（UptimeRobot）は「落ちている」ことしか見ないため、稼働したまま性能が
    # 劣化するケースはここで拾う（issue #23）。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # 依存を入れない。スクリプトは Node 標準の fetch だけで動く
      - name: Check sync-server metrics
        env:
          SYNC_METRICS_URL: https://sync.questboard.rictaworks.jp/metrics
          SYNC_SERVER_METRICS_TOKEN: ${{ secrets.SYNC_SERVER_METRICS_TOKEN }}
        # 通知本文に観測値を載せたいので出力を残す。tee を挟むとスクリプトの
        # 終了コードが握りつぶされるため pipefail で戻す
        run: |
          set -o pipefail
          node scripts/check-sync-metrics.mjs 2>&1 | tee metrics-check.log
          # 通知経路そのものを試験するための逃げ道。閾値超過を待たずに発火を確認できる。
          # 監視は「設定した」だけでは動いている保証にならないため、いつでも試せる形にしておく
          if [ "${{ inputs.alert_drill }}" = "true" ]; then
            echo "alert_drill が指定されたため、通知試験として意図的に失敗させる" | tee -a metrics-check.log
            exit 1
          fi
      # Railway のデプロイ失敗通知と同じ Slack チャンネルへ寄せる。
      # SLACK_WEBHOOK_URL が未登録の間は何もしない（ジョブの失敗自体は残る）
      - name: Notify Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL が未設定のため Slack へは通知しない"
            exit 0
          fi
          # ドリルの通知が本物のアラートと同じ見出しだと、受け取った側が判別できない
          TITLE="*questboard: /metrics の閾値を超過しました*"
          if [ "${{ inputs.alert_drill }}" = "true" ]; then
            TITLE="*[通知試験] questboard: 閾値アラートの発火確認（実際の超過ではありません）*"
          fi
          # 本文は jq で組み立てる。ログに引用符や改行が混ざっても JSON が壊れない
          jq -Rs --arg url "$RUN_URL" --arg title "$TITLE" \
            '{text: ($title + "\n```" + . + "```\n" + $url)}' \
            metrics-check.log > payload.json
          curl -sS -X POST -H 'Content-type: application/json' --data @payload.json "$SLACK_WEBHOOK_URL"
